services:
  iris:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    command: --check-caps false
    ports: 
      - 1972
      - 62773:52773
      - 63773
    volumes:
      - ./:/home/irisowner/dev
    networks:
      - wp

  db:
    expose:
      - 3306
    image: arm64v8/mysql
    #image: mysql:8.0
    volumes: 
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    restart: always
    environment:
      MYSQL_DATABASE: wp_db
      MYSQL_USER: admin
      MYSQL_ROOT_PASSWORD: password
      MYSQL_PASSWORD: 1234
    networks:
      - wp

  wordpress:
    ports:
      - "${PORT:-8000}:80"
    depends_on:
      - db
    image: wordpress:latest
    volumes:
      - ./wp-content:/var/www/html/wp-content
    environment:
      WORDPRESS_DB_NAME: wp_db
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_TABLE_PREFIX: da_
    user: "33:33"
    networks:
      - wp

networks:
  wp:
volumes:
  db_data:
  wp_data: